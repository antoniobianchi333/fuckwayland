[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fuckwayland"
version = "0.2.0"
description = "The X11 power tools (xdotool, wmctrl, xprop, xrandr) as drop-in clones for Wayland"
requires-python = ">=3.10"

[project.scripts]
wdotool = "wdotool.cli:main"
wwmctl = "wwmctl.cli:main"
wxprop = "wxprop.cli:main"
wxrandr = "wxrandr.cli:main"
warandr = "warandr.cli:main"
wmirror = "wmirror.cli:main"

[tool.setuptools]
packages = ["wdotool", "wwmctl", "wxprop", "wxrandr", "warandr", "wmirror"]

# Lint only, and never `ruff format`: at this line length the formatter
# rewrites 45 of 59 files, makes the tree 520 lines longer and flattens 338
# comments that are aligned on purpose.  120 is the hard limit; the code is
# written to 110.
[tool.ruff]
line-length = 120
# a generated 3000-line keysym table: nothing here has an opinion about it
extend-exclude = ["wdotool/keysyms.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# a transcribed keymap: one row per keycode, tabs and all
"wdotool/us_keymap.py" = ["E501", "W191"]
# xdotool's own help text has a trailing space, and we print it byte for byte
"wdotool/input_cmds.py" = ["W291"]
# the Gtk version must be pinned by gi.require_version before the import
"warandr/gui.py" = ["E402"]
